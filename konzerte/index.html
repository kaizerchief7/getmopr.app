<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F4EBD6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Konzerte">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" type="image/png" href="icon-180.png?v=2">
<title>Konzerte in der großen Stadt</title>
<style>
@font-face{font-family:Archivo;font-weight:400;font-display:swap;src:url(fonts/archivo-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Archivo;font-weight:600;font-display:swap;src:url(fonts/archivo-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Archivo;font-weight:700;font-display:swap;src:url(fonts/archivo-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Shrikhand;font-weight:400;font-display:swap;src:url(fonts/shrikhand-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Oswald;font-weight:600;font-display:swap;src:url(fonts/oswald-latin-600-normal.woff2) format("woff2")}
:root{--bg:#F4EBD6;--surface:#FFFAF0;--raised:#EADFC6;--line:#D3C6A8;--ink:#2B1A12;--muted:#6A5848;--accent:#E8572A;--accent-text:#A93A12;--senf:#E9B23F;--petrol:#1F4A4D;--error:#B3261E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Archivo,system-ui,-apple-system,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent-text)}
#app{max-width:560px;margin:0 auto;padding:0 18px calc(110px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 0 12px}
h1{margin:0;font-family:Oswald,"Arial Narrow",sans-serif;font-weight:600;font-size:32px;line-height:38px;letter-spacing:.01em}
h2{margin:0;font-family:Oswald,"Arial Narrow",sans-serif;font-weight:600;font-size:30px;line-height:34px}
.sub{font-size:13px;color:var(--muted)}
h1.brand{font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:34px;line-height:40px;letter-spacing:0}
.sub.brand{font-size:15px;font-weight:600;color:var(--muted);margin-top:-2px}
.mopr{display:flex;align-items:center;justify-content:center;gap:8px;margin:34px 0 0;color:var(--muted);font-size:13px;text-decoration:none}
.mopr b{font-family:Oswald,"Arial Narrow",sans-serif;font-size:16px;letter-spacing:.06em;color:var(--ink)}
.rec{display:inline-block;width:22px;height:22px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--bg) 0 6%,var(--accent) 7% 22%,var(--senf) 23% 33%,#111 34% 100%)}
.notiz{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.notiz .chip{flex:none}
.notiz p{margin:0;flex:1;min-width:0;font-size:15px;line-height:21px;overflow-wrap:anywhere}
.notiz small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.pinin{width:100%;min-height:56px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:28px;letter-spacing:.5em;text-align:center}
.over{font-family:Oswald,"Arial Narrow",sans-serif;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.chip{display:inline-flex;align-items:center;justify-content:center;height:26px;padding:0 9px;border-radius:999px;font-size:13px;font-weight:600;line-height:1;white-space:nowrap}
.st-fix{background:var(--senf);border:1px solid var(--senf)}
.st-geplant{background:var(--petrol);border:1px solid var(--petrol);color:#F4EBD6}
.st-eventuell{border:1.5px dashed var(--muted);color:var(--muted)}
.st-nein{border:1px solid var(--line);color:var(--muted);text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700}
.b-today{background:var(--accent)}
.b-frei{background:var(--surface);border:1.5px solid var(--accent);color:var(--accent-text)}
.b-tipp{border:1px solid var(--muted);color:var(--muted)}
.b-sold{border:1px solid var(--error);color:var(--error)}
.b-neu{background:var(--senf);color:#2B1A12}
.neuinfo{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px;background:var(--surface);border:2px solid var(--senf);border-radius:12px;font-size:15px}
.wahl{display:flex;flex-direction:column;gap:2px;width:100%;padding:10px 12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:15px}
.row.sel{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.legrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.suche{display:flex;gap:6px;align-items:center}.suche input{flex:1;min-width:0;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:inherit;font-size:16px;color:var(--ink)}
.jahr{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:44px;padding:0 4px;border:0;border-bottom:1px solid var(--line);background:transparent;font-family:Oswald,"Arial Narrow",sans-serif;font-size:18px;font-weight:600;color:var(--ink);cursor:pointer}
.addtop{display:none;min-height:40px;padding:0 16px;border:0;border-radius:999px;background:var(--accent);color:var(--ink);font-family:Oswald,"Arial Narrow",sans-serif;font-size:16px;font-weight:600;letter-spacing:.02em;cursor:pointer;white-space:nowrap}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:60px;height:60px;border:0;border-radius:50%;background:var(--accent);color:var(--ink);font-size:34px;line-height:1;font-weight:500;cursor:pointer;box-shadow:0 4px 14px rgba(43,26,18,.28);z-index:5}
.leer{display:flex;align-items:center;justify-content:center;height:60vh;color:var(--muted);text-align:center}
@media (min-width:1000px){
  body.breit #app{max-width:1180px;padding-bottom:0}
  .duo{display:grid;grid-template-columns:minmax(380px,460px) minmax(0,1fr);gap:32px;height:100vh;height:100dvh}
  .duo>div{overflow-y:auto;padding:0 18px 24px;min-width:0}
  .duo .bar{position:sticky;bottom:0;margin:20px -18px 0}
  .duo .bar>div{max-width:none}
  .duo-r .nav .back[data-act=liste]{visibility:hidden}
  body.breit .toast{max-width:420px}
  .addtop{display:inline-flex;align-items:center}
  .fab{display:none}
}
.seg{flex:1 1 0;min-height:44px;padding:4px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:14px;font-weight:600;cursor:pointer}
.seg.on{background:var(--senf);border-color:var(--senf)}
.segs{display:flex;gap:6px}
.row{display:flex;gap:12px;width:100%;padding:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.row.neu{border:2px solid var(--senf);padding:11px}
.neuinfo[data-act]{cursor:pointer}
.date{flex:none;width:46px;display:flex;flex-direction:column;align-items:center}
.date small{font-size:12px;font-weight:600;color:var(--muted)}
.date b{font-family:Oswald,"Arial Narrow",sans-serif;font-size:26px;line-height:30px;font-weight:600}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.band{font-size:18px;line-height:22px;font-weight:700}
.meta{font-size:14px;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(16px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.bar>div{max-width:524px;margin:0 auto}
.primary{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--accent);color:var(--ink);font-family:Oswald,"Arial Narrow",sans-serif;font-size:19px;font-weight:600;letter-spacing:.02em;cursor:pointer;text-decoration:none}
.secondary{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:15px;font-weight:600;cursor:pointer}
.take{flex:none;min-height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--accent);font-size:15px;font-weight:700;cursor:pointer}
.free{display:flex;gap:10px;align-items:center;padding:12px;background:var(--surface);border:2px solid var(--accent);border-radius:12px}
.card{display:flex;flex-direction:column;gap:4px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:15px}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lnk{display:flex;align-items:center;justify-content:center;min-height:48px;padding:4px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}
.nav{display:flex;align-items:center;justify-content:space-between;padding:calc(6px + env(safe-area-inset-top)) 0 6px;border-bottom:1px solid var(--line);margin:0 -18px 16px;padding-left:6px;padding-right:6px}
.back{min-height:44px;padding:0 10px;border:0;background:transparent;color:var(--accent-text);font-size:16px;font-weight:600;cursor:pointer}
.step{width:44px;height:44px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:20px;font-weight:700;cursor:pointer}
.steprow{display:flex;align-items:center;gap:10px}
.steprow span:first-child{flex:1;font-size:15px}
.steprow b{min-width:24px;text-align:center;font-size:18px}
.person{display:flex;align-items:center;gap:10px;min-height:36px}
.person .chip{min-width:44px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld input{width:100%;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px}
.fld input:focus,.seg:focus-visible,.row:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--petrol);outline-offset:2px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:16px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.whogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.whogrid button{min-height:64px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-family:Oswald,"Arial Narrow",sans-serif;font-size:24px;font-weight:600;cursor:pointer}
.whogrid button.on{background:var(--senf);border-color:var(--senf)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;display:flex;gap:10px;align-items:flex-start;padding:14px;background:var(--petrol);color:#F4EBD6;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5}
.toast[hidden]{display:none}
#linkfeld[hidden]{display:none!important}
.toast span{flex:1;font-size:15px;line-height:21px;white-space:pre-line}
.toast button{flex:none;min-width:44px;min-height:44px;border:0;border-radius:10px;background:var(--senf);font-weight:700;cursor:pointer}
.foot{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:28px;font-size:14px}
.foot button{border:0;background:none;padding:10px 0;color:var(--accent-text);font-size:14px;font-weight:600;text-decoration:underline;cursor:pointer}
.hint{font-size:14px;color:var(--muted)}
.danger{border:0;background:none;color:var(--error);font-size:15px;font-weight:600;padding:12px 0;text-decoration:underline;cursor:pointer;align-self:flex-start}
body.busy #app{opacity:.6;pointer-events:none}
.money{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.money .what{flex:1;min-width:0}
.tick{flex:none;min-width:92px;min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;font-weight:700;cursor:pointer}
.tick.on{background:#2E7D45;border-color:#2E7D45;color:#fff}
.amt{border:0;background:none;padding:6px 0;font:inherit;font-weight:700;color:var(--accent-text);text-decoration:underline;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stat b{display:block;font-family:Oswald,"Arial Narrow",sans-serif;font-size:28px;line-height:32px}
.stat span{font-size:13px;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pick button{min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-family:Oswald,"Arial Narrow",sans-serif;font-size:20px;font-weight:600;cursor:pointer}
.pick button.on{background:var(--senf);border-color:var(--senf)}
.msg{padding:48px 0;display:flex;flex-direction:column;gap:14px;font-size:16px}
</style>
</head>
<body>
<div id="app"><div class="msg">Lade …</div></div>
<div id="toast" class="toast" role="status" hidden><span></span><button type="button" data-act="toastweg">OK</button></div>
<script>
"use strict";
// Supabase-Projekt „recordstore“ – Adresse der Serverfunktion (öffentlich, kein Geheimnis)
var FN = "https://nazewbepsrjmvpkycymg.supabase.co/functions/v1/Konzerte";
var LINK_FN = "https://nazewbepsrjmvpkycymg.supabase.co/functions/v1/konzert-link";
var LINKDATEN = [];
var PUSH_FN = "https://nazewbepsrjmvpkycymg.supabase.co/functions/v1/konzert-push";
var PUSH_GEHT = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function pushApi(action, body) {
  var h = { "content-type": "application/json", "x-gruppe": KEY };
  if (ME && PIN) { h["x-wer"] = ME; h["x-pin"] = PIN; }
  return fetch(PUSH_FN, { method: "POST", headers: h, body: JSON.stringify(Object.assign({ action: action }, body || {})) })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || "Fehler " + r.status); return j; }); });
}
// Nach dem Speichern melden, was passiert ist – der Server liest die Fakten selbst und schickt an die anderen
function meldePush(action, p) {
  var typ = null, kid = null;
  // Korrekturen an vergangenen Konzerten melden wir niemandem
  var alt = p && p.konzert_id && DATA ? konzert(p.konzert_id) : null;
  if (alt && alt.datum < heute()) return;
  if (action === "konzert_speichern" && p.konzert && !p.konzert.id) typ = "neu";
  else if (action === "teilnahme" && (p.status === "nein" || p.frei > 0)) { typ = "absage"; kid = p.konzert_id; }
  else if (action === "notiz_neu") { typ = "notiz"; kid = p.konzert_id; }
  if (typ) pushApi("ereignis", { typ: typ, konzert_id: kid }).catch(function () {});
}
function unb64u(s) {
  var t = s.replace(/-/g, "+").replace(/_/g, "/"); t += "===".slice((t.length + 3) % 4);
  var b = atob(t), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u;
}
function swReg() { return navigator.serviceWorker.register("sw.js").then(function () { return navigator.serviceWorker.ready; }); }
function pushAbo() { return swReg().then(function (r) { return r.pushManager.getSubscription(); }); }
function badgeWeg() {
  try { if (navigator.clearAppBadge) navigator.clearAppBadge(); } catch (e) {}
  if (PUSH_GEHT && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(function (r) { return r.getNotifications(); }).then(function (n) { n.forEach(function (x) { x.close(); }); }).catch(function () {});
}
// Bereich „Mitteilungen“ in Meins – wird nach dem Zeichnen nachgefüllt
function pushBox() {
  var box = document.getElementById("pushbox"); if (!box) return;
  if (!PUSH_GEHT) {
    box.innerHTML = '<span class="hint"><b>So geht es:</b> Die Konzertliste auf den Home-Bildschirm legen (in Safari <b>Teilen › Zum Home-Bildschirm</b>) und von dort öffnen. ' +
      "Liegt sie schon dort und du siehst trotzdem diesen Hinweis: das Symbol einmal löschen und neu ablegen.</span>";
    return;
  }
  if (Notification.permission === "denied") { box.innerHTML = '<span class="hint">Mitteilungen sind für diese App ausgeschaltet. Einschalten: iPhone-<b>Einstellungen › Mitteilungen › Konzerte</b>.</span>'; return; }
  pushAbo().then(function (sub) {
    if (!sub) return null;
    return pushApi("status", { endpoint: sub.endpoint }).then(function (j) { return j.aktiv ? j.wahl : null; });
  }).then(function (wahl) {
    var w = wahl || load("pushwahl") || "alles";
    var segs = '<div class="segs">' + [["alles", "Alles"], ["wichtig", "Nur Absagen & freie Karten"]].map(function (o) {
      return '<button type="button" class="seg' + (w === o[0] ? " on" : "") + '" data-act="pushwahl" data-v="' + o[0] + '" aria-pressed="' + (w === o[0]) + '">' + o[1] + "</button>";
    }).join("") + "</div>";
    box.innerHTML = wahl
      ? '<span style="font-size:15px"><b>✓ An</b> auf diesem Handy.</span>' + segs +
        '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" type="button" data-act="pushtest">Test schicken</button>' +
        '<button class="secondary" type="button" data-act="pushaus">Ausschalten</button></div>'
      : '<span class="hint">Bekomme eine Mitteilung, wenn jemand ein Konzert einträgt, absagt, eine Karte abgibt oder eine Notiz schreibt – mit roter Zahl am Symbol. Deine eigenen Einträge meldet es dir nicht.</span>' + segs +
        '<button class="primary" type="button" data-act="pushan">Mitteilungen einschalten</button>';
  }, function () { box.innerHTML = '<span class="hint">Gerade nicht erreichbar – bitte später nochmal.</span>'; });
}
// Übernimmt nur Fakten in das Formular; vorhandene Eingaben bei Band bleiben stehen
function linkFuellen(e, quelle) {
  var f = document.getElementById("f"); if (!f) return;
  if (!f.band.value.trim()) f.band.value = e.band;
  if (e.datum) f.datum.value = e.datum;
  if (e.beginn) f.beginn.value = e.beginn;
  if (e.ort) f.ort.value = e.ort;
  if (e.preis) f.preis.value = e.preis;
  if (e.ticket_link) f.ticket_link.value = e.ticket_link;
  toast("Übernommen von " + (quelle || "der Seite") + " – bitte kurz prüfen." + (e.abgesagt ? "\nAchtung: dort als abgesagt markiert." : ""));
}

// Shop sperrt die Vorschau (Eventim, München Ticket): Link übernehmen, Band/Ort aus der Adresse vorschlagen
function linkVorschlag(j) {
  var f = document.getElementById("f"); if (!f) return;
  var v = j.vorschlag || {}, w = (v.woerter || "").trim(), ort = "";
  var norm = function (x) { return x.toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").replace(/[^a-z0-9]+/g, " ").trim(); };
  var nw = norm(w);
  DATA.konzerte.forEach(function (c) {
    if (!c.ort) return;
    var no = norm(c.ort.split(/[\/,(]/)[0]);
    if (no && (nw === no || nw.slice(-no.length - 1) === " " + no) && no.length > norm(ort).length) ort = c.ort;
  });
  if (ort) w = w.split(" ").slice(0, nw.split(" ").length - norm(ort.split(/[\/,(]/)[0]).split(" ").length).join(" ");
  if (v.ticket_link) f.ticket_link.value = v.ticket_link;
  if (w && !f.band.value.trim()) f.band.value = w;
  if (ort && !f.ort.value.trim()) f.ort.value = ort;
  document.getElementById("linkwahl").innerHTML = "";
  toast((j.quelle || "Die Seite") + " lässt keine Vorschau zu. Link ist übernommen" + (w ? ", Band aus der Adresse – bitte prüfen" : "") + ". Datum bitte selbst eintragen.");
}

// Ergebnis von Link- oder Bild-Erkennung ins Formular bringen (ein Termin: direkt; mehrere: Auswahl)
function linkErgebnis(j) {
  if (j.gesperrt) { linkVorschlag(j); return; }
  LINKDATEN = j.events || [];
  var box = document.getElementById("linkwahl"); if (!box) return;
  if (!LINKDATEN.length) { box.innerHTML = ""; toast((j.quelle === "dem Bild" ? "Auf dem Bild habe ich kein Konzert erkannt" : "Auf dieser Seite stehen keine lesbaren Termine") + " – bitte selbst ausfüllen."); return; }
  if (LINKDATEN.length === 1) { box.innerHTML = ""; linkFuellen(LINKDATEN[0], j.quelle); return; }
  box.innerHTML = '<span class="lbl">' + LINKDATEN.length + " Termine gefunden – welcher?</span>" + LINKDATEN.map(function (e, i) {
    var fd = fmt(e.datum);

// Doppelt? Gleiches Datum und ähnliche Band (Wörter, Tippfehler) oder gleicher Ort
function bandAehnlich(a, b) {
  var x = norm(a).replace(/[^a-z0-9]+/g, " ").trim().replace(/^(the|die|the) /, ""), y = norm(b).replace(/[^a-z0-9]+/g, " ").trim().replace(/^(the|die) /, "");
  if (!x || !y) return false;
  if (x === y || x.indexOf(y) === 0 || y.indexOf(x) === 0) return true;
  var xs = x.replace(/ /g, ""), ys = y.replace(/ /g, "");
  if (xs === ys) return true;
  if (Math.abs(xs.length - ys.length) > 2) return false;
  var d = [], i, j; // Tippfehler-Abstand (Levenshtein), höchstens 2
  for (i = 0; i <= xs.length; i++) { d[i] = [i]; }
  for (j = 1; j <= ys.length; j++) d[0][j] = j;
  for (i = 1; i <= xs.length; i++) for (j = 1; j <= ys.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (xs[i - 1] === ys[j - 1] ? 0 : 1));
  return d[xs.length][ys.length] <= (xs.length > 6 ? 2 : 1);
}
function doppelt(k) {
  var o = norm(k.ort).replace(/[^a-z0-9]/g, "");
  return DATA.konzerte.filter(function (c) {
    if (c.datum !== k.datum || c.id === k.id) return false;
    return bandAehnlich(c.band, k.band) || (o && norm(c.ort).replace(/[^a-z0-9]/g, "") === o);
  })[0];
}

// ---------------------------------------------------------------- Server
function api(action, payload, still) {
  var body = Object.assign({ action: action }, payload || {});
  if (!still) { busy = true; document.body.classList.add("busy"); }

  return fetch(FN, { method: "POST", headers: h, body: JSON.stringify(body) })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.fehler || "Fehler " + r.status); e.status = r.status; e.code = j.code || ""; throw e; } return j; }); })
    .then(function (j) { mischen(j); meldePush(action, payload || {}); return j; })

}

function rohApi(action, payload) {

  if (ME && PIN) { h["x-wer"] = ME; h["x-pin"] = PIN; }

}
// Der Server schickt nur ein Zeitfenster (ab j.ab) plus geänderte/offene ältere Konzerte.
// Ältere, die schon geladen wurden („Ältere laden“), bleiben im ARCHIV und werden aufgefrischt.
var ARCHIV = {}, ARCHIV_DA = false;
function mischen(j) {
  var ab = j.ab || "0000-00-00", neu = j.konzerte || [];
  (j.archiv || []).forEach(function (c) { ARCHIV[c.id] = c; });
  if (j.archiv) ARCHIV_DA = true;
  var fenster = {};
  neu.forEach(function (c) { if (c.datum < ab) ARCHIV[c.id] = c; else fenster[c.id] = true; });
  // Ein Konzert, das gelöscht wurde oder sein Datum geändert hat, nicht doppelt zeigen
  Object.keys(ARCHIV).forEach(function (id) { if (fenster[id] || ARCHIV[id].datum >= ab) delete ARCHIV[id]; });
  var alle = neu.filter(function (c) { return c.datum >= ab; }).concat(Object.keys(ARCHIV).map(function (id) { return ARCHIV[id]; }));
  alle.sort(function (a, b) { return (a.datum + (a.beginn || "")).localeCompare(b.datum + (b.beginn || "")); });
  var seen = {};
  alle = alle.filter(function (c) { if (seen[c.id]) return false; seen[c.id] = true; return true; });
  DATA = { freunde: j.freunde || [], konzerte: alle, ich: j.ich || null, ab: ab, aeltere: j.aeltere || 0, jahre: j.jahre || (DATA && DATA.jahre) || {} };
}

  toast((e && e.message ? e.message : "Hat nicht geklappt") + ".\nBitte nochmal versuchen.");

function abrechnungDaten() {
  var pro = {};
  DATA.konzerte.forEach(function (c) {
    c.leute.forEach(function (p) {
      if (!p.gekauft_von) return;
      var anderer = null, richtung = null;

      else if (p.kuerzel === ME) { anderer = p.gekauft_von; richtung = "schulde"; }

      var x = pro[anderer] || (pro[anderer] = { wer: anderer, bekomme: [], schulde: [], offenB: 0, offenS: 0, erledigt: 0 });
      x[richtung].push({ c: c, p: p });

  });
  var liste = Object.keys(pro).sort().map(function (k) { return pro[k]; });

function eigeneBands() {

}
var bandTimer = null, bandAbfrage = 0;
function bandVorschlaege(text) {
  var dl = document.getElementById("bands"); if (!dl) return;
  var q = text.trim().toLowerCase();
  var eigene = eigeneBands().filter(function (b) { return !q || b.toLowerCase().indexOf(q) >= 0; }).slice(0, 8);
  var setze = function (extra) {
    var alle = eigene.slice();
    extra.forEach(function (n) { if (alle.indexOf(n) < 0) alle.push(n); });
    dl.innerHTML = alle.map(function (b) { return '<option value="' + esc(b) + '">'; }).join("");
  };
  setze([]);
  clearTimeout(bandTimer);
  if (q.length < 3) return;
  var nr = ++bandAbfrage;
  bandTimer = setTimeout(function () {
    fetch("https://itunes.apple.com/search?entity=musicArtist&country=DE&limit=8&term=" + enc(text.trim()))
      .then(function (r) { return r.json(); })
      .then(function (j) { if (nr === bandAbfrage) setze((j.results || []).map(function (x) { return x.artistName; })); })
      .catch(function () {});
  }, 350);
}

var DIENSTE = {
  spotify: ["Spotify", function (b) { return "https://open.spotify.com/search/" + enc(b); }],
  apple: ["Apple Music", function (b) { return "https://music.apple.com/de/search?term=" + enc(b); }],
  youtube: ["YouTube Music", function (b) { return "https://music.youtube.com/search?q=" + enc(b); }]
};
// Apple Music: Die Suchseite übergibt den Begriff nicht an die Musik-App am iPhone.
// Deshalb direkt die Künstlerseite suchen (Apple-Katalog, ohne Schlüssel) und verlinken.
var appleCache = {};
function appleKuenstler() {
  var a = document.getElementById("reinhoeren");
  if (!a || dienst() !== "apple") return;
  var band = a.getAttribute("data-band"), setze = function (url) { var x = document.getElementById("reinhoeren"); if (url && x && x.getAttribute("data-band") === band) x.href = url; };
  if (appleCache[band] !== undefined) { setze(appleCache[band]); return; }
  fetch("https://itunes.apple.com/search?entity=musicArtist&country=DE&limit=5&term=" + enc(band))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var res = (j.results || []).filter(function (x) { return /^https:\/\/music\.apple\.com\//.test(x.artistLinkUrl || ""); }), low = band.toLowerCase();
      var best = res.filter(function (x) { return (x.artistName || "").toLowerCase() === low; })[0] || res[0];
      var url = best && best.artistLinkUrl ? best.artistLinkUrl.replace(/\?.*$/, "") : null;
      appleCache[band] = url; setze(url);
    })
    .catch(function () {});
}

function teilen(text, url) {

}

  },
  neuspringen: function () {
    var t = heute(), c = DATA.konzerte.filter(function (x) { if (x.datum < t) return false; var n = neues(x); return n.neu || n.ab.length; })[0];
    if (c) gehe("detail", c.id); else render();
  },
  warnicht: function () {
    // Vergangenes Konzert: „War nicht dabei“. Mit Abrechnung bleibt der Eintrag (als „Kann nicht“), sonst austragen.
    var c = konzert(view.id), m = mein(c);
    if (!m) return;
    teilnahme(c, m.gekauft_von ? { status: "nein" } : { status: null }).then(render, fehler);
  },
  allesgesehen: function () { gesLaden(); DATA.konzerte.forEach(function (c) { GES[c.id] = neinListe(c); }); gesSpeichern(); render(); },
  liste: function () { gehe("list"); },
  meins: function () { gehe("meins"); },
  dienst: function (d) { store("dienst", d.v); render(); },
  notizneu: function () {
    var t = (document.getElementById("notizneu").value || "").trim();
    if (!t) { toast("Erst etwas eintippen."); return; }
    api("notiz_neu", { konzert_id: view.id, text: t }).then(render, fehler);
  },
  notizweg: function (d) {
    if (!confirm("Notiz löschen?")) return;
    api("notiz_loeschen", { id: d.id }).then(render, fehler);
  },
  zurueck: function (d) {
    var c = konzert(d.id);
    if (!confirm("Kauf für " + d.k + " bei „" + c.band + "“ zurücknehmen? Die Karte gilt dann wieder als offen.")) return;
    api("kauf_zurueck", { konzert_id: d.id, kuerzel: d.k, kaeufer: ME }).then(function () { render(); toast("Zurückgenommen."); }, fehler);
  },
  alle: function () { view.alle = !view.alle; render(); },
  kauf: function () { view.kauf = null; view.screen = "kauf"; render(); window.scrollTo(0, 0); },
  kaufwer: function (d) { var s = view.kauf.fuer; if (s[d.k]) delete s[d.k]; else s[d.k] = true; render(); },
  kaufspeichern: function () {
    var fuer = Object.keys(view.kauf.fuer), roh = (document.getElementById("kaufpreis").value || "").trim().replace(",", ".");
    var schon = konzert(view.kauf.id).leute.some(function (p) { return p.gekauft_von === ME; });
    if (!fuer.length && !schon) { toast("Bitte antippen, für wen du gekauft hast."); return; }
    if (roh && !/^\d+(\.\d{1,2})?$/.test(roh)) { toast("Preis bitte als Zahl, z. B. 34,50."); return; }
    api("gekauft", { konzert_id: view.kauf.id, kaeufer: ME, fuer: fuer, preis: roh || null }).then(function () {
      var andere = fuer.filter(function (k) { return k !== ME; });
      view.screen = "detail"; view.id = view.kauf.id; render(); window.scrollTo(0, 0);
      if (!fuer.length) { toast("Kauf zurückgenommen."); return; }
      toast(andere.length ? "Eingetragen. " + andere.join(", ") + (andere.length > 1 ? " sehen" : " sieht") + " jetzt, was zu zahlen ist.\nAbhaken unter „Meins“." : "Eingetragen.");
    }, fehler);
  },
  bezahlt: function (d) {
    var c = konzert(d.id), p = c.leute.filter(function (x) { return x.kuerzel === d.k; })[0];
    api("bezahlt", { konzert_id: d.id, kuerzel: d.k, kaeufer: ME, bezahlt: !p.bezahlt }).then(render, fehler);
  },
  betrag: function (d) {
    var v = prompt("Betrag in € für " + d.k + " (alle Karten zusammen):", d.b ? String(d.b).replace(".", ",") : "");
    if (v === null) return;
    v = v.trim().replace(",", ".").replace("€", "").trim();
    if (v && !/^\d+(\.\d{1,2})?$/.test(v)) { toast("Bitte als Zahl, z. B. 61,80."); return; }
    api("betrag", { konzert_id: d.id, kuerzel: d.k, kaeufer: ME, betrag: v || null }).then(render, fehler);
  },
  tab: function (d) { view.tab = d.v; render(); },
  jahr: function (d) {
    view.offen = view.offen || {};
    view.offen[d.y] = !view.offen[d.y];
    // Jahr liegt (teilweise) vor dem Zeitfenster und ist noch nicht geladen → einmal nachladen
    if (view.offen[d.y] && !ARCHIV_DA && DATA.jahre && DATA.jahre[d.y]) { api("archiv").then(render, fehler); return; }
    render();
  },
  suchweg: function () { view.q = ""; render(); },
  tippweg: function () { store("tipp-weg", "1"); render(); },
  open: function (d) { if (d.id) gehe("detail", d.id); else gehe("list"); },
  neu: function () { gehe("form", null); },
  bearbeiten: function () { gehe("form", view.id); },
  neuladen: function () { api("laden").then(function () { render(); toast("Aktuell."); }, fehler); },
  einladen: function () { teilen("Unsere Konzertliste – einfach antippen und dein Kürzel wählen:", gruppenLink()); },
  st: function (d) {
    var c = konzert(view.id), m = mein(c) || {}, neu = { status: d.v };
    if (d.v === "nein" && m.karte === "hab") neu.frei = m.karten || 1;
    if (d.v !== "nein" && m.status === "nein") neu.frei = 0;
    teilnahme(c, neu).then(function () {
      render();
      if (d.v === "nein" && neu.frei) toast("Schade! Deine Karte steht jetzt oben in der Liste als frei.\nWer sie will, tippt „Nehm ich“.");
    }, fehler);
  },
  karte: function (d) { var c = konzert(view.id); teilnahme(c, { karte: d.v, frei: d.v === "hab" ? (mein(c).frei || 0) : 0 }).then(render, fehler); },
  anzahl: function (d) {
    var c = konzert(view.id), m = mein(c), n = Math.max(1, Math.min(20, m.karten + Number(d.v)));
    teilnahme(c, { karten: n, frei: Math.min(m.frei, n) }).then(render, fehler);
  },
  frei: function (d) {
    var c = konzert(view.id), m = mein(c), f = Math.max(0, Math.min(m.karten, m.frei + Number(d.v)));
    teilnahme(c, { frei: f }).then(render, fehler);
  },
  austragen: function () { var c = konzert(view.id); teilnahme(c, { status: null }).then(render, fehler); },
  take: function (d) {
    api("uebernehmen", { konzert_id: d.id, von: d.von, an: ME }).then(function () {
      render(); toast("Karte von " + d.von + " übernommen.\nBezahlen macht ihr direkt untereinander.");
    }, function (e) { if (e.status === 409) { api("laden").then(render); toast("Die Karte ist leider schon weg."); } else fehler(e); });
  },
  teilen: function (d) {
    var c = konzert(d.id), f = fmt(c.datum);
    teilen(c.band + " – " + f.wd + " " + f.day + ". " + f.mon + (c.beginn ? ", " + c.beginn + " Uhr" : "") + (c.ort ? ", " + c.ort : "") + ". Wer ist dabei?", gruppenLink());
  },
  ich: function (d, el) {
    Array.prototype.forEach.call(document.querySelectorAll("#ich .seg"), function (b) { b.classList.toggle("on", b === el); });
  },
  speichern: function () {
    var f = document.getElementById("f"), g = function (n) { return f.elements[n] ? f.elements[n].value.trim() : ""; };
    if (!g("band") || !g("datum")) { toast("Bitte noch Band und Datum eintragen."); return; }
    var link = g("ticket_link");
    if (link && !/^https:\/\//i.test(link)) { toast("Der Ticket-Link muss mit https:// beginnen."); return; }
    var neu = view.screen === "form" && !view.id;
    var on = document.querySelector("#ich .seg.on");
    var k = { id: view.id || undefined, band: g("band"), datum: g("datum"), beginn: g("beginn"), ort: g("ort"), preis: g("preis"), vorverkauf: g("vorverkauf"), ticket_link: link, notiz: g("notiz"), ausverkauft: !!(f.elements.ausverkauft && f.elements.ausverkauft.checked) };
    var dop = neu ? doppelt(k) : null;
    if (dop) {
      var fd = fmt(dop.datum);
      if (!confirm("Am " + fd.day + ". " + fd.mon + " steht schon „" + dop.band + "“" + (dop.ort ? " (" + dop.ort + ")" : "") + " in der Liste.\n\nOK = trotzdem neu anlegen\nAbbrechen = das vorhandene öffnen")) { gehe("detail", dop.id); toast("Hier kannst du dich eintragen."); return; }
    }
    api("konzert_speichern", { konzert: k, wer: ME, ich_status: on ? on.getAttribute("data-v") : "" }).then(function (j) {
      view.screen = "detail"; view.id = j.id || view.id; render(); window.scrollTo(0, 0);
      if (neu) toast("Gespeichert.\nJetzt unten „An die Gruppe schicken“ – dann wissen alle Bescheid.");
    }, fehler);
  },
  loeschen: function () {
    if (!confirm("Konzert wirklich löschen? Das gilt für alle.")) return;
    delete ARCHIV[view.id];
    api("konzert_loeschen", { id: view.id }).then(function () { view.id = null; gehe("list"); toast("Gelöscht."); }, fehler);
  }
};

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (!el || busy) return;
  var fn = A[el.getAttribute("data-act")];
  if (fn) { e.preventDefault(); fn(el.dataset, el); }
});

// Link ins Feld eingesetzt → sofort übernehmen (kein extra „Übernehmen“-Tipp)
document.addEventListener("paste", function (e) {
  if (!e.target || e.target.id !== "linkquelle") return;
  setTimeout(function () { if (/https?:\/\//.test(e.target.value || "") && !busy) A.linklesen(); }, 0);
});

function start() {
  KEY = leseSchluessel(); ME = load("me"); PIN = load("pin");
  render();
  if (!KEY || FN.indexOf("PROJEKT") >= 0) return;
  api("laden").then(function () {
    if (ME && !DATA.freunde.some(function (f) { return f.kuerzel === ME; })) { ME = null; store("me", null); }
    if (ME && PIN && DATA.ich !== ME) { PIN = null; store("pin", null); }
    render();
    setlistAuto();
  }, function (e) {
    if (e.status === 401) { fehler(e); return; }
    document.getElementById("app").innerHTML = '<div class="msg"><h1>Konzerte</h1><p>Gerade keine Verbindung.</p><button class="secondary" type="button" onclick="start()">Nochmal versuchen</button></div>';
  });
}
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") badgeWeg();
  if (document.visibilityState === "visible" && KEY && DATA && view.screen !== "form" && !busy) api("laden").then(render, function () {});
});
start();
if (PUSH_GEHT) { navigator.serviceWorker.register("sw.js").catch(function () {}); badgeWeg(); }
</script>
</body>
</html>
